name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite application
        env:
          VITE_USE_REMOTE_SUPABASE: "true"
          VITE_SUPABASE_URL: "https://hadecaexijgjjzsweyuu.supabase.co"
          VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhhZGVjYWV4aWpnamp6c3dleXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDQ1NTcsImV4cCI6MjEwODc4MDU1N30.fVebR00XLhQYMNTqYq1LUdCvOmvsMINPgQO3O__9p6Y"
        run: npm run build

      - name: Copy index.html to 404.html for GitHub Pages SPA routing
        run: cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch (Dual deployment guarantee)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
        continue-on-error: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
